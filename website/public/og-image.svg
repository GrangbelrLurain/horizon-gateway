<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="voidBg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060814"/>
    </radialGradient>
    <linearGradient id="energyBeam" x1="600" y1="80" x2="600" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ECFEFF"/>
      <stop offset="25%" stop-color="#67E8F9"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#083344" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pureLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#voidBg)"/>

  <circle cx="600" cy="280" r="260" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.12" stroke-dasharray="4 12"/>
  <circle cx="600" cy="280" r="200" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.15" stroke-dasharray="10 30"/>
  <path d="M 600 90 L 600 470" stroke="url(#energyBeam)" stroke-width="3" filter="url(#neonGlow)" opacity="0.6"/>

  <g transform="translate(600 280) scale(0.34)" filter="url(#neonGlow)">
    <path d="M 0 -332 L 332 0 L 0 332 L -332 0 Z" fill="#0284C7" fill-opacity="0.08" stroke="#22D3EE" stroke-width="8"/>
    <path d="M 0 -272 L 272 0 L 0 272 L -272 0 Z" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="380" ry="100" fill="none" stroke="#22D3EE" stroke-width="6" opacity="0.45" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="420" ry="70" fill="none" stroke="#0EA5E9" stroke-width="3" opacity="0.3" transform="rotate(10)"/>
    <circle cx="0" cy="0" r="150" fill="url(#coreGlow)" opacity="0.85"/>
    <circle cx="0" cy="0" r="65" fill="url(#pureLight)"/>
    <circle cx="0" cy="0" r="22" fill="#FFFFFF"/>
  </g>

  <g transform="translate(600 500)">
    <text x="-124" y="0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="42" fill="#E2E8F0" letter-spacing="8">HORIZON</text>
    <g transform="translate(0 -20) scale(2.8)">
      <path d="M 0 -10 L 10 0 L 0 10 L -10 0 Z" stroke="#E2E8F0" stroke-width="1.2" fill="none" opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="12" ry="3.5" stroke="#38BDF8" stroke-width="1" fill="none" opacity="0.4" transform="rotate(-15)"/>
      <circle cx="0" cy="0" r="3.5" fill="#38BDF8" opacity="0.35" filter="url(#subtleGlow)"/>
      <circle cx="0" cy="0" r="1.2" fill="#FFFFFF"/>
    </g>
    <text x="124" y="0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="42" fill="#E2E8F0" letter-spacing="8">GATEWAY</text>
  </g>

  <text x="600" y="580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9CA3AF" letter-spacing="2">Local Dev-Infra Control Center</text>
</svg>
